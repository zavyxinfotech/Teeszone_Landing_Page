<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeesZone | Enterprise Custom T-Shirt Printing & Corporate Apparel</title>
    <meta name="description" content="TeesZone is the leading enterprise custom T-shirt printing and corporate apparel brand. Premium 240 GSM organic fabrics, zero minimum order, 48-hour express delivery, and 1200 DPI precision screen & embroidery customization." />
    <meta name="keywords" content="custom t-shirts, corporate apparel, custom polo shirts, embroidered hoodies, bulk printing, screen printing, 240 GSM tees, Pantone matching, custom swag kits" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://teeszone.in/" />
    <link rel="icon" type="image/png" href="/assets/images/logo_png.png" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://teeszone.in/" />
    <meta property="og:title" content="TeesZone | Enterprise Custom Apparel & T-Shirt Printing" />
    <meta property="og:description" content="Custom corporate T-shirts, embroidered polo shirts, hoodies & swag kits for world-class brands. Ultra-HD print quality and 48hr express turnaround." />
    <meta property="og:image" content="/assets/images/teeszone_hero_mockup_1786102788341.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TeesZone | Enterprise Custom Apparel & T-Shirt Printing" />
    <meta name="twitter:description" content="Custom corporate T-shirts, embroidered polo shirts, hoodies & swag kits for world-class brands. Ultra-HD print quality and 48hr express turnaround." />
    <meta name="twitter:image" content="/assets/images/teeszone_hero_mockup_1786102788341.jpg" />
    
    <!-- Preconnect & Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&family=Poppins:wght@500;600;700;800;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <!-- Schema.org JSON-LD Structured Data for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TeesZone",
        "url": "https://teeszone.in",
        "logo": "https://teeszone.in/assets/images/logo_png.png",
        "description": "Leading enterprise custom T-shirt printing and corporate apparel brand offering 1200 DPI high-density screen printing, embroidery, and 48-hour express dispatch.",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91 99446 87485",
          "contactType": "Customer Support",
          "availableLanguage": "English"
        },
        "sameAs": [
          "https://facebook.com/teeszone_official",
          "https://instagram.com/teeszone_official",
          "https://linkedin.com/company/teeszone"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TeesZone Enterprise Apparel Platform",
        "url": "https://teeszone.in",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://teeszone.in/#products?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body class="bg-white text-[#241A1D] font-sans antialiased selection:bg-[#80011F]/20 selection:text-[#80011F] overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
